[workspace]
resolver = "2"
members = [
  "delegated-asset-account",
  "recursive-delegate-account"
]

[workspace.dependencies]
soroban-sdk = "=27.0.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
